<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar d-none d-md-block d-lg-block bg-first-custom" data-bs-theme="dark">

</li>
</ul>
</div>
</nav>

<!-- Second Navbar -->
<nav class="navbar navbar-expand-lg sticky-top" id="navbarColor">
<div class="container">
<a class="navbar-brand fw-bold fs-3 linkColor" href="#">
<img src="./MEDIA/LOGO.svg" alt="website logo" class="logo" id="logo_navbar"></a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
<i class="fa-solid fa-bars linkColor"></i>
</button>

<div class="collapse navbar-collapse" id="navbarSupportedContent">
<div class="widthCustom">
<div>
</div>
</div>

<ul class="navbar-nav mx-auto mb-2 mb-lg-0">
<li class="nav-item">

<a class="nav-link linkColor" href="./shop.html">Shop</a>
</li>
</ul>

<form class="d-flex" role="search">
<input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
</form>

<i class="fa-solid fa-cart-shopping mx-3 linkColor text-accent-custom"></i>
<i class="fa-regular fa-user linkColor text-accent-custom"></i>
</div>
</div>
</nav>

<!-- Header -->
<header class="container-fluid my-3">
<section class="row">
<article class="col-12 text-center">
<h1>Our Shop</h1>
</article>
</section>
</header>

<!-- Shop Section -->
<main class="container-fluid">
<section class="row">
<div class="col-12 col-md-3">
<h3>Filter by:</h3>
<div class="accordion" id="accordionExample">

<div class="accordion-item">
<h2 class="accordion-header" id="headingOne">
<button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
<h4>Category</h4>
</button>
</h2>

<div id="collapseOne" class="accordion-collapse collapse" aria-labelledby="headingOne"
data-bs-parent="#accordionExample">
<div class="accordion-body" id="radioWrapper">
<div class="form-check">
<input class="form-check-input" type="radio" name="categories" id="All" checked>
<label class="form-check-label" for="All">
All categories
</label>
</div>
</div>
</div>
</div>

<div class="accordion-item">
<h2 class="accordion-header" id="headingTwo">
<button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
<h4>Price</h4>
</button>
</h2>

<div id="collapseTwo" class="accordion-collapse collapse" aria-labelledby="headingTwo"
data-bs-parent="#accordionExample">
<div class="accordion-body">
<input type="range" class="w-100" max="100" id="priceInput">
<p id="priceRange">0</p>
</div>
</div>
</div>

<div class="accordion-item">
<h2 class="accordion-header" id="headingThree">
<button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
<h4>Word</h4>
</button>
</h2>

<div id="collapseThree" class="accordion-collapse collapse" aria-labelledby="headingThree"
data-bs-parent="#accordionExample">
<div class="accordion-body">
<input type="text" class="form-control" placeholder="Search..." value="" id="wordInput">
</div>
</div>
</div>

</div>
</div>

<div class="col-12 col-md-9 d-flex flex-wrap justify-content-between" id="cardWrapper">
</div>

</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./shop.js"></script>
</body>
</html>
